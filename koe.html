<style>
*{box-sizing:border-box}
html{background:#0b0b0a;-webkit-text-size-adjust:100%}
body{margin:0}
/* 夜の地に白金。上に一番強い声を大きく、下に一通ずつ「手紙」のように並べる。単一の暗いテーマ */
:root{
  --night:#0b0b0a; --night2:#141412; --pt:#c5c1b5; --pt-hi:#f2f1ed; --pt-lo:#8f8a7c; --hair:rgba(197,193,181,.22);
  --aur1:rgba(120,190,170,.20); --aur2:rgba(150,140,210,.16); --star:#e9e4d4; --starOff:#3a3935;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --num:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:dark;
}
body{background:var(--night);color:var(--pt-hi);font-family:var(--sans);font-size:14px;line-height:1.9;-webkit-font-smoothing:antialiased}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 60% at 15% -10%,var(--aur1),transparent 60%),radial-gradient(90% 50% at 95% 5%,var(--aur2),transparent 60%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(18px) scale(1.04);opacity:.8}}
.dots{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 9%,#fff,transparent),radial-gradient(1px 1px at 46% 31%,#ddd,transparent),radial-gradient(1px 1px at 88% 42%,#fff,transparent),radial-gradient(1px 1px at 27% 57%,#ccc,transparent),radial-gradient(1px 1px at 63% 73%,#fff,transparent),radial-gradient(1px 1px at 8% 86%,#ddd,transparent),radial-gradient(1px 1px at 91% 91%,#fff,transparent)}
@media (prefers-reduced-motion:reduce){.sky{animation:none}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px 32px}

.head{text-align:center}
.mark{display:block;width:34px;height:34px;margin:0 auto 18px}
h1{margin:0;font-family:var(--mincho);font-weight:600;font-size:30px;letter-spacing:.24em;text-indent:.24em;line-height:1.5}
.sub{margin:10px 0 0;color:var(--pt);font-family:var(--mincho);font-size:14px;letter-spacing:.14em}
.stat{display:flex;justify-content:center;align-items:center;gap:14px;margin:30px auto 0;padding:16px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);max-width:330px;color:var(--pt);font-size:12px;letter-spacing:.08em}
.stat b{font-family:var(--num);font-weight:500;font-size:52px;line-height:1;color:var(--pt-hi);letter-spacing:0}
.stat .st{text-align:left;line-height:1.6;color:var(--pt-hi);font-size:13px}
.stat small{display:block;color:var(--pt-lo);font-size:11px}

.lead{position:relative;margin:44px 0 0;padding:34px 22px 28px;border:1px solid var(--hair);background:linear-gradient(180deg,rgba(242,241,237,.045),rgba(242,241,237,.01))}
.lead::before{content:"";position:absolute;left:50%;top:-1px;width:64px;height:1px;transform:translateX(-50%);background:var(--pt-hi);box-shadow:0 0 14px rgba(242,241,237,.7)}
.lead q{display:block;font-family:var(--mincho);font-weight:600;font-size:min(20px,4.3vw);line-height:2;letter-spacing:.02em;text-align:center;quotes:none}
.lead q span{display:block;white-space:nowrap}
.lead p{margin:18px 0 0;text-align:center;color:var(--pt-lo);font-size:12px;letter-spacing:.1em}

.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:40px 0 0}
.chip{border:1px solid var(--hair);background:transparent;color:var(--pt);font:inherit;font-family:var(--mincho);font-size:13px;letter-spacing:.06em;padding:6px 14px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip span{margin-left:6px;font-family:var(--num);font-size:15px;color:var(--pt-lo)}
.chip[aria-pressed="true"]{background:var(--pt-hi);border-color:var(--pt-hi);color:#0d0c0c}
.chip[aria-pressed="true"] span{color:#0d0c0c}
.chip:focus-visible,.more:focus-visible{outline:2px solid var(--pt-hi);outline-offset:3px}
.count{margin:18px 0 0;text-align:center;color:var(--pt-lo);font-size:12px;letter-spacing:.1em}

/* 横にすべらせる帯。いま真ん中の一枚だけが浮かび上がり、両脇は沈んで薄い */
.rail{position:relative;margin:0 calc(-1 * max(18px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(18px,env(safe-area-inset-right,0px)))}
.list{list-style:none;margin:0;padding:18px 9% 30px;display:flex;gap:14px;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 9%;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.list::-webkit-scrollbar{display:none}
.rv{flex:0 0 82%;scroll-snap-align:center;position:relative;padding:22px 20px 18px;background:var(--night2);border:1px solid var(--hair);display:grid;gap:12px;
  opacity:.45;transform:translateY(16px) scale(.95);filter:saturate(.6);
  transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1),box-shadow .9s,border-color .9s,filter .7s}
.rv.on{opacity:1;transform:translateY(0) scale(1);filter:none;border-color:rgba(197,193,181,.5);box-shadow:0 26px 50px -26px rgba(0,0,0,.9),0 0 40px -10px rgba(242,241,237,.10)}
.rv.on .tx{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:2px}
.arw{width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);background:transparent;color:var(--pt);display:grid;place-items:center;cursor:pointer;transition:border-color .2s,opacity .2s}
.arw:disabled{opacity:.25;cursor:default}
.arw:not(:disabled):hover{border-color:var(--pt)}
.arw:focus-visible{outline:2px solid var(--pt-hi);outline-offset:3px}
.pos{min-width:64px;text-align:center;font-family:var(--num);font-size:18px;color:var(--pt-hi);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.pos span{color:var(--pt-lo);font-size:14px}
.hint{margin:8px 0 0;text-align:center;color:var(--pt-lo);font-size:11px;letter-spacing:.14em}
@media (prefers-reduced-motion:reduce){.rv,.rv.on{transition:none}.rv.on .tx{animation:none}}
.rv::after{content:"";position:absolute;inset:4px;border:1px solid rgba(197,193,181,.08);pointer-events:none}
.top{display:flex;align-items:center;gap:12px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--pt);font-family:var(--mincho);font-size:15px;color:var(--pt-hi);background:radial-gradient(circle at 35% 30%,rgba(242,241,237,.18),transparent 70%)}
.nm{font-family:var(--mincho);font-size:14px;letter-spacing:.06em;line-height:1.5}
.nm small{display:block;font-family:var(--sans);color:var(--pt-lo);font-size:11px;letter-spacing:.04em}
.meta{margin-left:auto;text-align:right;line-height:1.4}
.stars{display:inline-flex;gap:2px}
.stars svg{width:13px;height:13px}
.when{display:block;color:var(--pt-lo);font-size:11px}
.tx{margin:0;font-family:var(--mincho);font-weight:500;font-size:15px;line-height:2;letter-spacing:.03em;color:#e6e4de;white-space:pre-line;overflow-wrap:anywhere}
.tx.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.tx mark{background:linear-gradient(transparent 62%,rgba(242,241,237,.22) 62%);color:var(--pt-hi)}
.more{justify-self:start;border:0;background:none;padding:0 0 2px;border-bottom:1px solid var(--pt-lo);color:var(--pt);font:inherit;font-size:12px;letter-spacing:.12em;cursor:pointer}
.empty{flex:1 0 100%;padding:34px 0;text-align:center;color:var(--pt-lo);opacity:1}
.foot{margin:34px 0 0;color:var(--pt-lo);font-size:11px;line-height:1.9;text-align:center}
@media (max-width:360px){h1{font-size:26px}.tx{font-size:14px}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div><div class="dots" aria-hidden="true"></div>
<div class="wrap">
  <div class="rail"><ul class="list" id="list" aria-label="口コミ（横にすべらせて読む）"></ul></div>
  <div class="nav"><button class="arw" id="prev" type="button" aria-label="前の口コミ"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <p class="pos" id="pos" aria-live="polite"></p>
    <button class="arw" id="next" type="button" aria-label="次の口コミ"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button></div>
</div>

<script>
var PUB = [{"d": "2026/10/14", "s": 4, "t": "鑑定を申し込んでいたのをすっかり忘れていたところに届いた今回の鑑定結果でした。言い当てを読んで正直少し驚いています。迷走中の今、向かう方向を示してもらった気分になりました。"}, {"d": "2026/10/14", "s": 5, "t": "気長に待っていました。鑑定ありがとうございました。自分でも忘れていた過去の状況が言い当てられていました。そういえば、そんなだったなぁと思い出すきっかけになりました。意外と時が過ぎると、辛かったことや我慢していたことを忘れてしまって、そこに現在の根っこがあることに気づけずにズルズルと過ごしていってしまうところでした。自分らしく心から笑って過ごせるよう、本鑑定をお願いしたいと思います。"}, {"d": "2026/10/14", "s": 4, "t": "すっかり忘れた頃に届いたメッセージ。\n思い当たる気の流れと、ここ数年の悩みを言い当てられた気持ちになりました。\n自分の人生をどう胸を張って歩いていけばよいかを思い出させてもらえたことに感謝です。"}, {"d": "2026/10/15", "s": 5, "t": "この度はお世話になりました。\nこの段階で、すごい‼️の一言でした。\n最近、自分の事は後回し、やりたい事も後回しになっている事が少し気になっていました。この先は、少しずつでも自分の事を大切に、やりたい事を大切に過ごしていきたいと思いました。　ありがとうございます。"}, {"d": "2026/10/15", "s": 5, "t": "まるで全てを見透かされているかの様な驚きでいっぱいです。期待しては打ち消し…そんな想いを繰り返しながらも諦め切れず想い続けて来ました。この先の未来が知りたくなりました"}, {"d": "2026/10/15", "s": 5, "t": "鑑定ありがとうございます\n書かれていることが驚くほど自分に当てはまっておりした。無料とは思えないボリュームで自分が描かれていました。自分はこう、そしてこの悩みは別角度からはこう見えると悩みで視野が狭くなっていたのを広げて見るアドバイス頂きました。多角的に考えを巡らせ向き合って生きたいと思います。この度は鑑定してくださりありがとうございます"}, {"d": "2026/10/15", "s": 5, "t": "沢山の方が無料鑑定に応募されてい\nるし、していただけないのではと諦めていましたが、鑑定書が届いて驚いています。\n自分の気持ちも言い当てられていて、辛かった時のことを思い出して、泣きそうになりました。\nもっと先のことも知りたいと思いました。"}, {"d": "2026/10/16", "s": 4, "t": "この度はありがとうございました。\n『この先どうなるんだろう？』とかんじましたが、それは不安よりもワクワクを強く感じてます。"}, {"d": "2026/10/17", "s": 5, "t": "丁寧に対応と鑑定が理解しやすいようにまとめ下さりありがいです"}, {"d": "2026/10/18", "s": 5, "t": "鑑定ありがとうございます✨\n私の心を見透かされてるような感じでビックリしてます。少し自分なりに整理して考えてみようと思っております。"}, {"d": "2026/10/19", "s": 5, "t": "鑑定ありがとうございます。確かに周りの人や困ってる人を優先してしまうことが多いかもしれません。11月に頼まれごとがあれば、じっくり考えてから返事をするよう心がけてみます。そして、もっと自分優先にしていくクセをつけようと思いました。"}, {"d": "2026/11/01", "s": 5, "t": "そう自分で思っていなくても、もう1人の自分が私にレッテルを貼ったり、点数をつけていたりしてその葛藤続きでした。本当にそうなのか？問いかけられた時にハッとしました。自分を優先することが出来ず、わからないことだらけな自分を変えたいと強く思いました。ありがとうございます。"}, {"d": "2026/11/01", "s": 5, "t": "無料の鑑定でここまで詳細に分かるのですか？という内容でした。驚きました。\n私自身の気持ちに寄り添って下さり、気持ちが楽になりました。\n本鑑定もお願いしたいと思います。"}, {"d": "2026/11/03", "s": 5, "t": "とても納得のできる素敵な鑑定でした。ありがとうございます。"}, {"d": "2026/11/04", "s": 5, "t": "誰にも言えずにひとりで抱えてきた心のうちを、「どうしてそこまで分かるの？」と思うくらい見透かされて、思わず息をのむような不思議な感覚になりました。周りを優先して自分を後回しにしてきた日々の重みや、胸の奥で揺れていた迷いをやさしくすくい上げてもらえたことで、張り詰めていた気持ちがふっと軽くなり、じんわりとあたたかい感謝が込み上げてきます。自分の本質をここまで深く受け止め、肯定してもらえた驚きを大切に抱きしめながら、これからの毎日にそっと寄り添うお守りにしたいと感じます。"}, {"d": "2026/11/05", "s": 5, "t": "無料でここまで解説してくれるのには驚きました。天極星紋は初めて聞きましたが心にスっと入ってくる文書が良かったです。"}, {"d": "2026/11/09", "s": 5, "t": "生年月日で詳しく見て頂きありがとうございました。思い当たる点も複数あって、また一言アドバイスもあり、嬉しかったです。\n縁が戻りやすい星回りと聞いたので希望をもって進みたいと思います。"}, {"d": "2026/11/09", "s": 5, "t": "書いてあることが当たってて！！そうなんです。自分で揺らしてそして逃げてしまうんですよね。うまく行かなくなるとリセットして投げ出したくなる気持ちが生まれてしまって。\n鑑定を通して教えていただきありがとうございます！\n逃げずにがんばってみます！！"}, {"d": "2026/11/15", "s": 5, "t": "遅くなりましたが、みていただきありがとうございます。\n12月や6月など、具体的な月が出てくるのには驚きました。そこまで具体的にはっきりと教えていただけるのは、他の占いや霊視とは違うなと思いました。少し希望が持てました。ありがとうございます。"}, {"d": "2026/11/19", "s": 5, "t": "丁寧な鑑定、ありがとうございました。\n今の状況が当たっており、とても驚きました。方向性が見え、少し安心いたしました。\nこんなに詳しいとは思いませんでした。\n本当にありがとうございました。"}];
var KEYS = [
  {k:"驚いた", re:/驚|ビックリ|すごい/},
  {k:"言い当てられた", re:/当た|言い当て|当てはま|思い当た/},
  {k:"見透かされた", re:/見透か/},
  {k:"丁寧・詳しい", re:/丁寧|詳し|詳細|ボリューム|解説/},
  {k:"続きを知りたい", re:/知りたい|本鑑定/},
  {k:"心が軽くなった", re:/楽に|軽く|安心|希望/},
  {k:"自分を大切に", re:/自分優先|自分を優先|自分の事を大切|後回し/}
];
var state={key:null};
function star(on){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var('+(on?'--star':'--starOff')+')" d="M12 17.3 18.2 21l-1.6-7 5.4-4.7-7.2-.6L12 2 9.2 8.7l-7.2.6 5.4 4.7-1.6 7z"/></svg>';}
function stars(n){var h='';for(var i=1;i<=5;i++)h+=star(i<=n);return '<span class="stars" role="img" aria-label="5つ星のうち'+n+'">'+h+'</span>';}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ago(d){var p=d.split("/"),t=new Date(+p[0],+p[1]-1,+p[2]),days=Math.floor((new Date()-t)/864e5);
  if(days<1)return "今日";if(days<7)return days+"日前";if(days<30)return Math.floor(days/7)+"週間前";if(days<365)return Math.floor(days/30)+"か月前";return Math.floor(days/365)+"年前";}
var ch='<button class="chip" type="button" aria-pressed="true" data-k="">すべて<span>'+PUB.length+'</span></button>';
KEYS.forEach(function(o,i){var c=PUB.filter(function(r){return o.re.test(r.t);}).length;if(c)ch+='<button class="chip" type="button" aria-pressed="false" data-k="'+i+'">'+o.k+'<span>'+c+'</span></button>';});

function render(){
  var key=state.key===null?null:KEYS[state.key];
  var rows=PUB.map(function(r,i){return Object.assign({i:i},r);}).filter(function(r){return !key||key.re.test(r.t);})
    .sort(function(a,b){return b.d.localeCompare(a.d)||b.i-a.i;});
  var list=document.getElementById("list");
  if(!rows.length){list.innerHTML='<li class="empty">この言葉を含む口コミはありません</li>';setPos();return;}
  list.innerHTML=rows.map(function(r){
    var t=esc(r.t);
    if(key)t=t.replace(new RegExp("("+key.re.source+")","g"),"<mark>$1</mark>");
    var long=r.t.length>120||(r.t.match(/\n/g)||[]).length>5;
    return '<li class="rv"><div class="top"><span class="av" aria-hidden="true">匿</span><div class="nm">匿名の方<small>無料鑑定</small></div>'+
      '<div class="meta">'+stars(r.s)+'<span class="when" title="'+r.d+'">'+ago(r.d)+'</span></div></div>'+
      '<p class="tx'+(long?' clamp':'')+'">'+t+'</p>'+(long?'<button class="more" type="button">続きを読む</button>':'')+'</li>';
  }).join("");
  list.scrollLeft=0; watch(); setPos();
}
// いま真ん中にある一枚を探して浮かべる
var list=document.getElementById("list"), cur=0, io=null;
function cards(){return Array.prototype.slice.call(list.querySelectorAll(".rv"));}
function center(){var c=cards();if(!c.length)return 0;var mid=list.getBoundingClientRect().left+list.clientWidth/2,best=0,bd=1e9;
  c.forEach(function(el,i){var b=el.getBoundingClientRect(),d=Math.abs(b.left+b.width/2-mid);if(d<bd){bd=d;best=i;}});return best;}
function setPos(){var c=cards();cur=center();c.forEach(function(el,i){el.classList.toggle("on",i===cur);});
  document.getElementById("pos").innerHTML=c.length?(cur+1)+' <span>/ '+c.length+'</span>':'';
  document.getElementById("prev").disabled=cur<=0;document.getElementById("next").disabled=cur>=c.length-1;}
function watch(){if(io)io.disconnect();if(!("IntersectionObserver" in window))return;
  io=new IntersectionObserver(function(){setPos();},{root:list,threshold:[.55,.75]});cards().forEach(function(el){io.observe(el);});}
var tick=null;list.addEventListener("scroll",function(){clearTimeout(tick);tick=setTimeout(setPos,60);},{passive:true});
function go(d){var c=cards(),i=Math.max(0,Math.min(c.length-1,cur+d));if(!c[i])return;
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  list.scrollTo({left:c[i].offsetLeft-(list.clientWidth-c[i].offsetWidth)/2,behavior:reduce?"auto":"smooth"});}
document.getElementById("prev").addEventListener("click",function(){go(-1);});
document.getElementById("next").addEventListener("click",function(){go(1);});
list.addEventListener("keydown",function(e){if(e.key==="ArrowRight"){go(1);e.preventDefault();}if(e.key==="ArrowLeft"){go(-1);e.preventDefault();}});
list.tabIndex=0;
document.getElementById("list").addEventListener("click",function(e){var b=e.target.closest(".more");if(!b)return;var p=b.previousElementSibling,c=p.classList.toggle("clamp");b.textContent=c?"続きを読む":"閉じる";});
render();
</script>

</body>
</html>
