<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜神威</title>
<script>
// リンクの後ろに「）」「。」などが付いて開かれたとき（LINE・メッセージで URL の直後に括弧や句点があると、そこまでリンクになる）は、正しいページへ移す
(function () {
  var pages = ['arigato', 'uketsuke', 'kantei', 'naze'];
  var p = location.pathname;
  try { p = decodeURIComponent(p); } catch (e) {}
  var m = p.replace(/^\/+/, '').match(/^([a-z]+)/);
  if (m && pages.indexOf(m[1]) !== -1 && p !== '/' + m[1]) { location.replace('/' + m[1] + location.search + location.hash); return; }
  if (/^\/?[)）」』。、.,]+$/.test(p)) location.replace('/' + location.search);
})();
</script>

:root{--bg:#f2f4f5;--fg:#38434f;--h:#18202b}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;text-align:center;letter-spacing:.06em;line-height:2;padding:0 24px}
h1{font-size:19px;font-weight:600;color:var(--h);margin:0 0 8px}

</style>
</head>

<main>
  <h1>ページが見つかりません</h1>
  <p>リンクが途中で切れているかもしれません。</p>

</main>
</body>
